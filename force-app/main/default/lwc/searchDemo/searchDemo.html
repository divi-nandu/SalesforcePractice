
<template>
    <lightning-card title="Search Demo">
        <div class="slds-p-around_medium">

            <lightning-input
                type="search"
                label="Search Employees"
                placeholder="Enter a name or department..."
                value={searchText}
                onchange={handleSearch}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <h2 class="slds-text-heading_medium">
                    Employee List
                </h2>

                <template
                    for:each={filteredEmployees}
                    for:item="employee">

                    <div
                        key={employee.id}
                        class="slds-box slds-m-top_small">

                        <p>
                            <strong>Name:</strong> {employee.name}
                        </p>

                        <p>
                            <strong>Department:</strong>
                            {employee.department}
                        </p>
                    </div>
                </template>

                <template lwc:if={noEmployeesFound}>
                    <p class="slds-m-top_medium">
                        No employees found.
                    </p>
                </template>

                <p class="slds-m-top_medium">
                    Total Results: {filteredEmployees.length}
                </p>
            </div>

        </div>
    </lightning-card>
</template>
