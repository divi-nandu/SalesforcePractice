<template>
    <lightning-card title="Wire Apex With Parameter" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <lightning-input label="Search account name" onchange={handleChange}></lightning-input>
            <template if:true={accounts.data}>
                <template for:each={accounts.data} for:item="acc">
                    <p key={acc.Id}>{acc.Name} - {acc.Industry}</p>
                </template>
            </template>
            <template if:true={accounts.error}>
                <p>Error loading accounts</p>
            </template>
        </div>
    </lightning-card>
</template>
