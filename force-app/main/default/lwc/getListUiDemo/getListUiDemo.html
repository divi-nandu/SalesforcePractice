<template>
    <lightning-card title="Get List UI Adapter" icon-name="standard:contact">
        <div class="slds-var-p-around_medium">
            <template if:true={contacts.length}>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Title</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={contacts} for:item="contact">
                            <tr key={contact.fields.Id.value}>
                                <td>{contact.fields.Name.value}</td>
                                <td>{contact.fields.Email.value}</td>
                                <td>{contact.fields.Title.value}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <div class="slds-grid slds-var-m-top_medium">
                <div class="slds-var-m-around_medium">
                    <lightning-button label="Previous" onclick={handlePrevious}></lightning-button>
                </div>
                <div class="slds-var-m-around_medium">
                    <lightning-button label="Next" onclick={handleNext}></lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
