<template>
    <lightning-card title="Support Desk" icon-name="standard:case">

        <div slot="actions" class="slds-text-body_small">
            Working with: {objectLabels}
        </div>

        <!-- Clickable navigation items -->
        <div class="slds-var-p-horizontal_medium slds-var-m-bottom_small slds-text-color_weak">
            Go to:
            <template for:each={navItems} for:item="item" for:index="index">
                <a
                    key={item.key}
                    href="#"
                    data-index={index}
                    class="slds-var-m-left_small"
                    onclick={handleNavClick}>
                    {item.label}
                </a>
            </template>
        </div>

        <div class="slds-grid slds-wrap slds-var-p-horizontal_medium">

            <!-- Left side: Open Cases list -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12 slds-var-p-right_small">
                <c-case-list
                    selected-id={selectedId}
                    oncaseselect={handleSelect}>
                </c-case-list>
            </div>

            <!-- Right side: Selected Case details -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">

                <template lwc:if={hasSelection}>

                    <c-case-header
                        record-id={selectedId}>
                    </c-case-header>

                    <c-case-actions
                        record-id={selectedId}
                        oncasechange={handleChange}
                        oncasedeleted={handleDeleted}>
                    </c-case-actions>

                    <c-case-tabs
                        record-id={selectedId}
                        oncasechange={handleChange}>
                    </c-case-tabs>

                </template>

                <template lwc:else>
                    <p class="slds-var-p-around_medium slds-text-color_weak">
                        Select a case from the list to see its details.
                    </p>
                </template>

            </div>
        </div>

        <!-- Case creation form -->
        <div class="slds-var-p-around_medium">
            <c-case-create
                oncasechange={handleChange}>
            </c-case-create>
        </div>

    </lightning-card>
</template>
