<template>
    <lightning-card title="Get Picklist Values Demo: Industry" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <lightning-combobox
                name="industry"
                label="Industry"
                value={selectedIndustry}
                placeholder="Select Industry"
                options={industryOptions}
                onchange={handleIndustryChange}>
            </lightning-combobox>
            <p class="slds-var-m-top_small">Selected industry: {selectedIndustry}</p>
        </div>
    </lightning-card>
</template>
