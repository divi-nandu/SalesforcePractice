<template>
    <lightning-card title="Data Carousel">
        <div class="slds-m-around_medium">

            <lightning-carousel>
                <template for:each={carouselDetails} for:item="item">

                    <lightning-carousel-image
                        key={item.header}
                        src={item.image}
                        header={item.header}
                        description={item.description}
                        alternative-text={item.header}>
                    </lightning-carousel-image>

                </template>
            </lightning-carousel>

        </div>
    </lightning-card>
</template>
