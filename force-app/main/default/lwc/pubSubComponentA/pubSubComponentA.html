<template>
    <lightning-card title="Pub Sub Component A">
        <div class="slds-m-around_medium">

            <lightning-input
                type="text"
                label="Enter Message"
                onkeyup={inputHandler}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Publish"
                    onclick={publishHandler}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
