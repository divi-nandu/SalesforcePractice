
<template>
    <div class="mood-container">

        <div class="mood-grid">

            <button
                class={feelGoodClass}
                data-mood="Feel Good"
                onclick={handleMoodClick}
                aria-pressed={isFeelGoodSelected}
            >
                <span class="mood-emoji">😊</span>
                <span class="mood-name">Feel Good</span>
                <span class="mood-description">
                    Feel happier and inspired
                </span>
                <span class="mood-arrow">Explore movies →</span>
            </button>

            <button
                class={emotionalClass}
                data-mood="Emotional"
                onclick={handleMoodClick}
                aria-pressed={isEmotionalSelected}
            >
                <span class="mood-emoji">🥹</span>
                <span class="mood-name">Emotional</span>
                <span class="mood-description">
                    Stories that touch your heart
                </span>
                <span class="mood-arrow">Explore movies →</span>
            </button>

            <button
                class={thrillerClass}
                data-mood="Thriller"
                onclick={handleMoodClick}
                aria-pressed={isThrillerSelected}
            >
                <span class="mood-emoji">😱</span>
                <span class="mood-name">Thriller</span>
                <span class="mood-description">
                    Mystery, suspense and twists
                </span>
                <span class="mood-arrow">Explore movies →</span>
            </button>

            <button
                class={actionClass}
                data-mood="Action"
                onclick={handleMoodClick}
                aria-pressed={isActionSelected}
            >
                <span class="mood-emoji">⚡</span>
                <span class="mood-name">Action</span>
                <span class="mood-description">
                    Adventure and adrenaline
                </span>
                <span class="mood-arrow">Explore movies →</span>
            </button>

        </div>

        <template lwc:if={selectedMood}>
            <div class="selection-message">
                <span>✓</span>
                Showing recommendations for
                <strong>{selectedMood}</strong>
                <button
                    class="clear-button"
                    onclick={handleClearMood}
                    title="Clear selected mood"
                >
                    Clear
                </button>
            </div>
        </template>

    </div>
</template>
