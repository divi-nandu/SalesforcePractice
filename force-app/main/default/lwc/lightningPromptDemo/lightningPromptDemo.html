<template>
    <lightning-card title="Lightning Prompt Demo">
        <div class="slds-m-around_medium">
            <p>Click below to enter your name.</p>

            <lightning-button
                label="Enter Name"
                variant="brand"
                onclick={askName}>
            </lightning-button>

            <template lwc:if={resultMessage}>
                <p class="slds-m-top_medium">{resultMessage}</p>
            </template>
        </div>
    </lightning-card>
</template>
