<template>
    <lightning-card title="Imperative Apex Demo" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <lightning-button
                label="Load Accounts"
                variant="brand"
                onclick={handleLoad}>
            </lightning-button>

            <template if:true={isLoaded}>
                <template if:true={accounts.length}>
                    <template for:each={accounts} for:item="acc">
                        <p key={acc.Id} class="slds-var-m-top_small">
                            {acc.Name} - {acc.Industry}
                        </p>
                    </template>
                </template>

                <template if:false={accounts.length}>
                    <template if:false={errorMessage}>
                        <p>No Accounts found.</p>
                    </template>
                </template>
            </template>

            <template if:true={errorMessage}>
                <p class="slds-text-color_error">{errorMessage}</p>
            </template>
        </div>
    </lightning-card>
</template>
