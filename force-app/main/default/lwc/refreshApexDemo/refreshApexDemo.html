<template>
    <lightning-card title="refreshApex Demo" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>

            <template if:true={accounts.data}>
                <template for:each={accounts.data} for:item="acc">
                    <div key={acc.Id} class="slds-var-m-top_small">
                        <p><strong>{acc.Name}</strong> - {acc.Industry}</p>
                        <lightning-button
                            label="Set Industry to Banking"
                            data-id={acc.Id}
                            onclick={handleBanking}>
                        </lightning-button>
                    </div>
                </template>
            </template>

            <template if:true={accounts.error}>
                <p>Error loading accounts</p>
            </template>

            <template if:true={message}>
                <p class="slds-var-m-top_small">{message}</p>
            </template>
        </div>
    </lightning-card>
</template>
