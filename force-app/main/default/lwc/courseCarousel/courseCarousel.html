
<template>
    <lightning-card title="Training Course Carousel" icon-name="utility:apps">
        <div class="slds-p-around_medium">

            <div class="course-card">
                <div class="course-icon">
                    <lightning-icon
                        icon-name={currentIcon}
                        alternative-text="Course icon"
                        size="large">
                    </lightning-icon>
                </div>

                <h2 class="slds-text-heading_medium slds-m-top_medium">
                    {currentSlide.title}
                </h2>

                <p class="slds-m-top_small course-description">
                    {currentSlide.description}
                </p>

                <p class="slds-m-top_medium slide-counter">
                    Slide {currentIndexDisplay} of {totalSlides}
                </p>
            </div>

            <div class="slds-grid slds-grid_align-center slds-m-top_large">
                <lightning-button
                    label="Previous"
                    icon-name="utility:chevronleft"
                    onclick={handlePrevious}
                    disabled={isFirstSlide}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Next"
                    icon-name="utility:chevronright"
                    icon-position="right"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isLastSlide}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
