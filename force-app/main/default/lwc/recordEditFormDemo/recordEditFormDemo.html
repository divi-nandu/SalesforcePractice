<template>
    <lightning-card
        title="Lightning Record Edit Form"
        icon-name="standard:contact">

        <div class="slds-var-p-around_medium">

<lightning-record-edit-form
    object-api-name={objectName}
    record-id="003ak00002GjWj3AAF"
    onsuccess={handleSuccess}
    onerror={handleError}>


                <lightning-messages></lightning-messages>

                <lightning-input-field
                    field-name={fields.account}>
                </lightning-input-field>

                <lightning-input-field
                    field-name={fields.firstName}>
                </lightning-input-field>

                <lightning-input-field
                    field-name={fields.lastName}>
                </lightning-input-field>

                <lightning-input-field
                    field-name={fields.title}>
                </lightning-input-field>

                <lightning-input-field
                    field-name={fields.phone}>
                </lightning-input-field>

               
<label class="slds-form-element__label slds-p-left_x-small">
    Enter your email
</label>

<lightning-input-field
    field-name={fields.email}
    variant="label-hidden">
</lightning-input-field>


                <lightning-button
                    class="slds-m-around_xx-small"
                    label="Cancel"
                    onclick={handleReset}>
                </lightning-button>

                <lightning-button
                    class="slds-m-around_xx-small"
                    variant="brand"
                    type="submit"
                    label="Save">
                </lightning-button>

            </lightning-record-edit-form>

        </div>
    </lightning-card>
</template>
